title = "Lattice-Based Zero-Knowledge Proofs and Applications: Shorter, Simpler, and More General"
locator = "https://eprint.iacr.org/2022/284"
scope = "Lemma 2.9 states a fixed-mask Bin_1 projection bound at 256 rows, strict squared floor 26/4, failure 2^-128, and margin 41d. Its argument depends on heuristic Lemma 2.8 through Lemma 2.10 (Bin_2). Our matched balanced-ternary theorem removes that heuristic premise and improves the endpoint to 27. Separate one-coordinate counterexamples refute both the Bin_1 and Bin_2 lower claims in Lemma 2.8 and the modular Lemma 2.10. They do not refute the masked conclusion."
result_ids = [
  "rows256-ternary-affine-l2-threshold-lower-27-bits128",
]

