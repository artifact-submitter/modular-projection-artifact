schema_version = 2

# The result catalog is the readable source of exact result statements.  This
# canonical digest changes if any advertised constant, hypothesis, event,
# budget, Lean declaration, owner, paper locator, certificate dependency, or
# verification class changes.  TOML layout and comments do not affect it.
[certified_results]
inventory = "evidence/result-catalog.toml"
semantic_hash = "sha256-canonical-json-v1"
semantic_sha256 = "557e0135de86d1e822d6e76465e1ff698828486752f06d080b22777022301edf"
public_canaries = "evidence/public-api.toml"
certificate_dependencies = "evidence/certificates/public-results.toml"
replay_plan = "evidence/certificates/replay-families.toml"

[substantive_claims]
semantic_hash = "sha256-canonical-json-v1"
semantic_sha256 = "06f9258b98283b05bf11b16528743e11178f37ec295c6c386fc7934751883dcb"

[counterexample_evidence]
families = "evidence/counterexamples/families.toml"
witnesses = "evidence/counterexamples/witnesses.toml"
comparisons = "evidence/counterexamples/comparisons.toml"
generated_markdown = "docs/counterexample-coverage.md"
generated_tsv = "docs/counterexample-coverage.tsv"
semantic_hash = "sha256-canonical-json-v1"
semantic_sha256 = "cdeba556c80cba437df48d10d5c964c6894b2dedc03c42b298f548f0ee804b0d"

[headline_results]
result_ids = [
  "rows256-ternary-l2-threshold-lower-29-bits128",
  "rows256-ternary-affine-l2-threshold-lower-27-bits128",
  "rows256-ternary-linf-threshold-lower-21-over-50-bits133",
  "rows256-ternary-affine-linf-threshold-lower-67-over-200-bits130",
  "rows256-ternary-l2-upper-338-bits128",
  "rows256-ternary-linf-upper-39-over-4-bits133",
]

[paper_parameters]
rows = 256
security_bits = 128
orthus_security_bits = 133
ternary_lower = 29
ternary_upper = 338
ternary_threshold_margin_numerator = 3
ternary_threshold_margin_denominator = 1
ternary_upper_disproved = 336
orthus_infinity_numerator = 21
orthus_infinity_denominator = 50
orthus_threshold_margin_numerator = 2
orthus_threshold_margin_denominator = 1
orthus_extraction_slack_numerator = 325
orthus_extraction_slack_denominator = 14
orthus_modulus_coefficient_numerator = 325
orthus_modulus_coefficient_denominator = 7

[application_boundaries]
modular_lower_threshold_domain = "positive natural numbers; odd modulus"
euclidean_lower_event = "strict_lt; closed real acceptance is supplied with explicit strict headroom, including a real-input-threshold adapter by odd scaling"
structured_and_layered_adapter = "supplied for a history-selected input and shift fixed before a fresh matrix, real L2 thresholds, and finite call sets; invalid histories retain a separate budget term"
orthus_extraction_threshold = "max(1,ceil(50*A/21)) for every A>=0, with 2*max(1,ceil(50*A/21))<=q; 325/14 is the unrounded ratio for positive A=(39/4)B"

# Substantive negative results are explicit because they do not live in the
# positive result catalog.  Empty Lean/canary fields mean proof work is still
# outstanding; a nearby or external computation is never promoted silently.

